[project]
name = "learnswe-backend"
version = "0.1.0"
description = "Health-only backend for the learnSWE app preview"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
