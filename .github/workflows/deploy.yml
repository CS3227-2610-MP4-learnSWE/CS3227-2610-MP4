name: Deploy application

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, production]
      commit:
        description: Full master commit SHA with successful CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment == 'production' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ inputs.environment == 'production' && 'production' || 'development' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify CI, deploy exact commit, and smoke test
        env:
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: python scripts/deploy_render.py
