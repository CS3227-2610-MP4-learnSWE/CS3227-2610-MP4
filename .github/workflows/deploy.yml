name: Deploy application

on:
  push:
    branches: [deploy/production-pages]
    tags: [deploy-development-*, deploy-production-*]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/deploy/production-pages' ||
      startsWith(github.ref, 'refs/tags/deploy-development-') ||
      startsWith(github.ref, 'refs/tags/deploy-production-')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ startsWith(github.ref, 'refs/tags/deploy-production-') && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ startsWith(github.ref, 'refs/tags/deploy-production-') && 'production' || 'development' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify CI, deploy exact commit, and smoke test
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          WAIT_FOR_CI: "true"
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: python scripts/deploy_render.py
