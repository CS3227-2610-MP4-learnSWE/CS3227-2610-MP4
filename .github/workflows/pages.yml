name: Publish product website

on:
  push:
    branches: [deploy/production-pages]
    tags: [publish-site-*]
    paths:
      - "website/**"
      - "scripts/build_product_site.py"
      - "scripts/deploy_render.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/deploy/production-pages' ||
      startsWith(github.ref, 'refs/tags/publish-site-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build website with validated application URL
        env:
          PRODUCT_APP_URL: ${{ vars.PRODUCT_APP_URL }}
        run: python scripts/build_product_site.py --output build/product-site
      - name: Verify exact deployment-branch CI before publication
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from scripts.deploy_render import wait_for_ci, verify_commit
          sha = os.environ['DEPLOY_COMMIT']
          wait_for_ci(sha)
          verify_commit(sha)
          PY
      - name: Verify application login before publication
        env:
          PRODUCT_APP_URL: ${{ vars.PRODUCT_APP_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.request import Request, urlopen
          url = os.environ['PRODUCT_APP_URL'].strip().rstrip('/') + '/login'
          with urlopen(Request(url, headers={'Accept': 'text/html'}), timeout=90) as response:
              if response.status != 200 or 'text/html' not in response.headers.get('Content-Type', ''):
                  raise SystemExit('Application login is not available; publication stopped.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/product-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
