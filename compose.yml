services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: learnswe
      POSTGRES_PASSWORD: learnswe-local-only
      POSTGRES_DB: learnswe
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnswe -d learnswe"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  postgres_data:
